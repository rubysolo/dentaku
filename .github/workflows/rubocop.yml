name: rubocop
on:
  push:
  pull_request:
jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # No ruby-version: setup-ruby reads it from mise.toml, same as local dev.
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - run: bundle exec rubocop
